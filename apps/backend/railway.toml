# Railway configuration for SMS Insights Backend
[build]
builder = "nixpacks"

[build.nixpacks]
# Use Node.js 22 LTS
nodeVersion = "22"

# Build command
buildCmd = "npm ci && prisma generate && prisma db push --accept-data-loss && npm run build"

# Start command
startCmd = "npm start"

[deploy]
# Health check configuration
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables
[env]
NODE_ENV = "production"
SKIP_FRONTEND_BUILD = "true"

# Railway-specific optimizations
[experimental]
# Enable build caching
buildCache = true

# Service configuration
[service]
# Service name
name = "sms-insights-backend"

# Source directory (relative to railway.toml location)
sourceDir = "."