name: Generate Live Database Report

# Run daily at 2:00 AM UTC
on:
  schedule:
  - cron: '0 2 * * *'
  workflow_dispatch:


jobs:
  generate-report:
    name: Generate LIVE-DATABASE-REPORT.md
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sms-insights

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ./sms-insights/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check database secret
      id: db_secret
      env:
        DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
      run: |
        if [ -z "${DATABASE_PUBLIC_URL}" ]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "DATABASE_PUBLIC_URL is not set; skipping live report generation."
        else
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate live database report
      if: steps.db_secret.outputs.available == 'true'
      run: npm run generate:db-report
      env:
        DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        NODE_ENV: production

    - name: Commit and push report
      if: steps.db_secret.outputs.available == 'true'
      uses: EndBug/add-and-commit@v9
      with:
        author_name: 'github-actions[bot]'
        author_email: '41898282+github-actions[bot]@users.noreply.github.com'
        message: 'docs: update LIVE-DATABASE-REPORT.md'
        add: 'sms-insights/LIVE-DATABASE-REPORT.md'
        pull: '--rebase --autostash'

    - name: Report generation status
      run: |
        if [ "${{ steps.db_secret.outputs.available }}" = "true" ]; then
          echo "✅ Live database report generated and committed"
          echo "📊 Report location: sms-insights/LIVE-DATABASE-REPORT.md"
          head -20 LIVE-DATABASE-REPORT.md
        else
          echo "⚠️ Skipped report generation: DATABASE_PUBLIC_URL is not configured."
        fi
