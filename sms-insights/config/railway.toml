[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "apps/backend/**",
  "package.json",
  "package-lock.json",
  "prisma/**",
]

[deploy]
startCommand = "npm start"
postBuild = "npm run migrate:deploy"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.env]
NODE_ENV = "production"