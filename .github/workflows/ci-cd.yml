name: CI/CD Pipeline

"on":
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend (sms-insights)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint || true

    - name: Run backend tests
      run: npm run --workspace=ptbizsms-api build
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        SKIP_FRONTEND_BUILD: "true"
        NODE_ENV: test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm run --workspace=ptbizsms-dashboard-unified test

    - name: Run type check
      run: npm run --workspace=ptbizsms-dashboard-unified typecheck

    - name: Build
      run: npm run --workspace=ptbizsms-dashboard-unified build

  deploy-backend:
    name: Deploy Backend to Railway
    needs: [ test-backend, test-frontend ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up --service=sms-insights
      env:
        RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [ test-backend, test-frontend ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Install Vercel CLI
      run: npm install -g vercel

    - name: Deploy to Vercel
      run: vercel --prod --yes
      working-directory: ./apps/frontend
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Verify SEO crawl surface
      run: node scripts/verify-seo-surface.mjs
      env:
        SEO_AUDIT_BASE_URL: https://ptbizsms.com
