name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ./package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Validate Prisma schema
      run: npx prisma validate --config prisma.config.ts
      working-directory: apps/backend
    - name: Generate Prisma client
      run: npx prisma generate --config prisma.config.ts
      working-directory: apps/backend
    - name: Check migration drift
      run: npx prisma migrate status --config prisma.config.ts
      working-directory: apps/backend
    - name: Install Railway CLI
      run: npm install -g @railway/cli
    - name: Deploy to Railway
      run: railway up --detach --service=sms-insights --project=${{ vars.RAILWAY_PROJECT_ID }} --environment=${{ vars.RAILWAY_ENVIRONMENT }}
      env:
        RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ./package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Vercel CLI
      run: npm install -g vercel
    - name: Deploy to Vercel
      run: vercel --prod --yes
      working-directory: ./apps/frontend
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    - name: Verify SEO crawl surface
      run: node scripts/verify-seo-surface.mjs
      env:
        SEO_AUDIT_BASE_URL: https://ptbizsms.com
