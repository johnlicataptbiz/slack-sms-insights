# Railway configuration for SMS Insights Backend
[build]
builder = "nixpacks"

[build.nixpacks]
# Use Node.js 22.12.0 (satisfies Prisma 7 requirement of 22.12+)
nodeVersion = "22.12.0"

# Build command
buildCmd = "npm run build"

# Start command
startCmd = "npm start"

[deploy]
# Health check configuration
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables
[env]
NODE_ENV = "production"
SKIP_FRONTEND_BUILD = "true"

# Railway-specific optimizations
[experimental]
# Enable build caching
buildCache = true

# Service configuration
[service]
# Service name
name = "sms-insights-backend"

# Source directory (relative to project root)
sourceDir = "sms-insights"