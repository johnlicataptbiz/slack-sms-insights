    rulesFiles:
      - relativePath: AGENTS.md
        content: >-
          # Project Coding Rules (Non-Obvious Only)


          This file provides guidance to agents when working in code mode for
          this repository.


          ## Logging

          - Use `pino` for structured logging; avoid `console.log`


          ## Validation

          - Prefer `zod` for request validation


          ## TypeScript Execution

          - Use `tsx` for running TypeScript files directly (e.g., in scripts
          and tests)


          ## Component Patterns

          - Prefer `PasswordGate`, `RunList`, `RunDetail`, `SuspenseLoader`;
          lazy-load via `frontend/src/v2/V2App`


          ## Styling

          - Use `var(--color-ds-*)` in CSS files; animations via `--duration-*`,
          `--shadow-*`, `--radius-*`

          - Design tokens: Use `frontend/src/styles/design-tokens.ts` exports


          ## Asset Handling

          - Figma assets via MCP endpoints; no CDN replacements; store in
          `public/assets/figma/`

          - Figma integration: Fetch design context via MCP
          `get_design_context(fileKey, nodeId)` before changes


          ## Build Process

          - Backend prebuild generates changelog JSON, runs Prisma generate,
          conditionally builds frontend

          - Monorepo: Backend in `sms-insights/`, frontend in `frontend/`; root
          package.json uses workspaces but directories differ


          ## Testing

          - Backend uses Node test runner with `tsx`; run specific tests like
          `npm run test:monday-sms-sync`

          - Frontend typecheck: Use `npm run typecheck:v2` (tsconfig.v2.json)


          ## Accessibility

          - Keyboard focus, aria labels, WCAG AA contrast required
